<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ledgerline">
  <!-- Two lines that agree and one that does not reach across. Three shapes,
       because at 16px the shortfall has to read as a length difference rather
       than a colour one. The colours are the theme's `ink` and its mark. -->
  <rect x="4" y="7" width="24" height="3.5" rx="1" fill="#12180F" />
  <rect x="4" y="14.25" width="13" height="3.5" rx="1" fill="#9E2B22" />
  <rect x="4" y="21.5" width="24" height="3.5" rx="1" fill="#12180F" />
</svg>
