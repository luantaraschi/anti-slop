<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Chorus — booking for independent music venues</title>
    <meta
      name="description"
      content="Independent venues list the nights they have open. Touring bands search by route and date and offer on them. The accepted offer becomes the performance contract and the settlement sheet."
    />

    <!--
      Platform fact: theme-color paints the browser chrome on mobile Safari and
      Chrome. Without it a page on #120C18 gets a light bar sitting directly on
      top of it. The value is `blackbox`, and it is the one place a colour is
      restated outside the theme file, because <meta> cannot read a token.
    -->
    <meta name="theme-color" content="#120C18" />

    <!--
      chorus.example is the RFC 2606 reserved placeholder. og:url and og:image
      both have to be absolute, and the real host is not something this brief
      established; these two lines are the deploy step.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chorus" />
    <meta property="og:url" content="https://chorus.example/" />
    <meta property="og:title" content="Chorus — booking for independent music venues" />
    <meta
      property="og:description"
      content="Independent venues list the nights they have open. Touring bands search by route and date and offer on them. The accepted offer becomes the performance contract and the settlement sheet."
    />
    <meta property="og:image" content="https://chorus.example/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chorus, over a stage wash falling from congo blue into black." />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Two families, one weight of Syne and three of IBM Plex Sans — the exact
      set the components use and nothing beyond it. `display=swap` is what makes
      the accepted cost recorded in tailwind.config.ts a rewrap rather than
      three seconds of invisible headline.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
