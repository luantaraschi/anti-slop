name: Report a bug
description: A reproducible problem in the plugin, validator, fixtures, or documentation.
title: "Bug: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.3.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the invocation, target path, and smallest steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant output or code
      description: Remove credentials and private project data before posting.
